<svg width="520" height="720" viewBox="0 0 520 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone shell -->
  <rect x="60" y="20" width="400" height="680" rx="48" fill="#1a1d1e"/>
  <rect x="68" y="28" width="384" height="664" rx="42" fill="#111314"/>
  <!-- Screen -->
  <rect x="76" y="36" width="368" height="648" rx="36" fill="#F2F4F7"/>
  <!-- Dynamic island -->
  <rect x="196" y="52" width="128" height="28" rx="14" fill="#111314"/>

  <!-- Status bar time -->
  <text x="108" y="68" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#191c1d">9:41</text>

  <!-- Header bar -->
  <rect x="76" y="84" width="368" height="56" rx="0" fill="#ffffff"/>
  <text x="108" y="118" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#191c1d">Moje Mixy</text>
  <!-- Search icon -->
  <circle cx="404" cy="112" r="10" stroke="#6b7280" stroke-width="1.8" fill="none"/>
  <line x1="411" y1="119" x2="417" y2="125" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Section label -->
  <text x="108" y="164" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#506600" letter-spacing="1.2">DOSTUPNÉ MIXY</text>

  <!-- Mix Card 1 — highlighted "Hovězí srdce mix" -->
  <rect x="96" y="176" width="328" height="128" rx="20" fill="#ffffff" filter="url(#shadow1)"/>
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0000001a"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0000000f"/>
    </filter>
  </defs>
  <!-- Colored left accent -->
  <rect x="96" y="176" width="6" height="128" rx="3" fill="#c3e96b"/>
  <!-- Meat icon circle -->
  <circle cx="136" cy="240" r="28" fill="#f0fde4"/>
  <text x="136" y="248" font-family="sans-serif" font-size="24" text-anchor="middle">🥩</text>
  <!-- Text -->
  <text x="178" y="214" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#191c1d">Hovězí srdce mix</text>
  <text x="178" y="234" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">Svalovina + Srdce · 1.2 kg</text>
  <!-- Macro pills -->
  <rect x="178" y="248" width="64" height="22" rx="11" fill="#f0fde4"/>
  <text x="210" y="263" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#506600" text-anchor="middle">72 % prot.</text>
  <rect x="250" y="248" width="56" height="22" rx="11" fill="#fef9ec"/>
  <text x="278" y="263" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#92630a" text-anchor="middle">18 % tuk</text>
  <!-- Badge "nový" -->
  <rect x="326" y="182" width="44" height="20" rx="10" fill="#c3e96b"/>
  <text x="348" y="196" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#191c1d" text-anchor="middle">NOVÝ</text>
  <!-- Arrow -->
  <text x="392" y="244" font-family="sans-serif" font-size="18" fill="#9ca3af">›</text>

  <!-- Mix Card 2 -->
  <rect x="96" y="320" width="328" height="112" rx="20" fill="#ffffff" filter="url(#shadow2)"/>
  <rect x="96" y="320" width="6" height="112" rx="3" fill="#94a3b8"/>
  <circle cx="136" cy="376" r="28" fill="#f1f5f9"/>
  <text x="136" y="384" font-family="sans-serif" font-size="24" text-anchor="middle">🦴</text>
  <text x="178" y="358" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#191c1d">Kuřecí základní</text>
  <text x="178" y="378" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">Svalovina + Kosti · 0.8 kg</text>
  <rect x="178" y="390" width="64" height="22" rx="11" fill="#f0fde4"/>
  <text x="210" y="405" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#506600" text-anchor="middle">68 % prot.</text>
  <text x="392" y="380" font-family="sans-serif" font-size="18" fill="#9ca3af">›</text>

  <!-- Mix Card 3 -->
  <rect x="96" y="448" width="328" height="112" rx="20" fill="#ffffff" filter="url(#shadow2)"/>
  <rect x="96" y="448" width="6" height="112" rx="3" fill="#fca5a5"/>
  <circle cx="136" cy="504" r="28" fill="#fff1f2"/>
  <text x="136" y="512" font-family="sans-serif" font-size="24" text-anchor="middle">🫀</text>
  <text x="178" y="486" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#191c1d">Vnitřnostní mix</text>
  <text x="178" y="506" font-family="Inter, sans-serif" font-size="12" fill="#6b7280">Játra + Ledviny · 0.5 kg</text>
  <rect x="178" y="518" width="64" height="22" rx="11" fill="#fff1f2"/>
  <text x="210" y="533" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#be123c" text-anchor="middle">85 % prot.</text>
  <text x="392" y="508" font-family="sans-serif" font-size="18" fill="#9ca3af">›</text>

  <!-- Bottom nav bar -->
  <rect x="76" y="616" width="368" height="68" rx="0" fill="#ffffff"/>
  <rect x="76" y="616" width="368" height="1" fill="#e5e7eb"/>
  <!-- Nav icons -->
  <text x="136" y="642" font-family="sans-serif" font-size="18" text-anchor="middle">🏠</text>
  <text x="136" y="658" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Přehled</text>
  <text x="200" y="642" font-family="sans-serif" font-size="18" text-anchor="middle">📊</text>
  <text x="200" y="658" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Makra</text>
  <text x="260" y="638" font-family="sans-serif" font-size="22" text-anchor="middle">🥗</text>
  <rect x="238" y="612" width="44" height="44" rx="22" fill="#c3e96b"/>
  <text x="260" y="640" font-family="sans-serif" font-size="22" text-anchor="middle">🥗</text>
  <text x="260" y="658" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#506600" text-anchor="middle">Mixy</text>
  <text x="324" y="642" font-family="sans-serif" font-size="18" text-anchor="middle">🧊</text>
  <text x="324" y="658" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Lednice</text>
  <text x="388" y="642" font-family="sans-serif" font-size="18" text-anchor="middle">⚙️</text>
  <text x="388" y="658" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Nastavení</text>

  <!-- Home indicator -->
  <rect x="212" y="692" width="96" height="4" rx="2" fill="#1a1d1e" opacity="0.3"/>
</svg>
